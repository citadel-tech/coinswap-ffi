name: C# Tests

on:
  push:
    branches:
      - main
    paths:
      - 'coinswap-csharp/**'
      - 'ffi-commons/**'
      - '.github/workflows/test-csharp.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'coinswap-csharp/**'
      - 'ffi-commons/**'
      - '.github/workflows/test-csharp.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # Keep in lockstep with ffi-commons' uniffi crate version.
  UNIFFI_BINDGEN_CS_TAG: v0.11.0+v0.31.0

jobs:
  test-csharp:
    name: Test C# Bindings (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            rid: linux-x64
            build_script: build-linux.sh
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi-commons/target/
          key: ${{ runner.os }}-cargo-csharp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      # Cache only the generator binary (keyed on its tag), not all of ~/.cargo/bin,
      # so cargo/rustup shims are never overwritten.
      - name: Cache uniffi-bindgen-cs
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs
          key: ${{ runner.os }}-uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}

      - name: Install uniffi-bindgen-cs
        run: |
          if ! command -v uniffi-bindgen-cs >/dev/null 2>&1; then
            cargo install uniffi-bindgen-cs \
              --git https://github.com/NordSecurity/uniffi-bindgen-cs \
              --tag "$UNIFFI_BINDGEN_CS_TAG"
          fi

      - name: Build native library
        working-directory: coinswap-csharp
        run: bash ./build-scripts/${{ matrix.build_script }} ${{ matrix.rust_target }}

      - name: Generate C# bindings
        working-directory: ffi-commons
        run: |
          # Use the staged shared library (exactly one file), NOT a glob over the
          # target dir — that can match libcoinswap_ffi.a / .d and misgenerate the
          # DllImport name.
          LIB="../coinswap-csharp/Coinswap/runtimes/${{ matrix.rid }}/native/libcoinswap_ffi.so"
          uniffi-bindgen-cs --library "$LIB" --config uniffi.toml \
            --out-dir ../coinswap-csharp/Coinswap/Generated --no-format

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Start regtest stack
        working-directory: ./ffi-commons
        run: |
          chmod +x ffi-docker-setup
          if docker pull coinswap/bitcoin-mutinynet:latest && docker pull coinswap/coinswap:electrum-sync; then
            echo "Using prebuilt Docker images"
          else
            echo "Prebuilt image pull failed; falling back to local image build"
            ./ffi-docker-setup setup
          fi
          # Fixed topology: bitcoind + electrs + tor + 2 RPC makers + 2 Electrum makers.
          ./ffi-docker-setup start

      - name: Wait for stack readiness
        run: |
          echo "=== Docker Containers ==="
          docker ps -a
          echo -e "\n=== Waiting for host ports ==="
          for i in {1..30}; do
            all_ok=true
            for port in 18442 28332 9051 50001; do
              nc -z 127.0.0.1 "$port" 2>/dev/null && echo "port $port ok" || { echo "port $port not reachable"; all_ok=false; }
            done
            if $all_ok; then
              echo "All ports forwarded to host!"; break
            fi
            if [ "$i" -eq 30 ]; then echo "Timed out waiting for stack ports"; exit 1; fi
            echo "Retry $i/30..."
            sleep 2
          done

      - name: Wait for Tor egress then makers
        run: |
          # An open control port doesn't mean Tor can build circuits; probe real egress to a public relay, then poll both makers until each has set up and announced (empty offerbook otherwise => NotEnoughMakersInOfferBook).
          for i in {1..60}; do
            for relay in nos.lol relay.damus.io; do
              curl -s --max-time 20 --socks5-hostname 127.0.0.1:9050 "https://$relay" -o /dev/null && { echo "Tor egress OK via $relay (attempt $i)"; tor_ok=1; break; }
            done
            [ -n "$tor_ok" ] && break
            echo "waiting for Tor egress ($i/60)..."; sleep 5
          done
          [ -n "$tor_ok" ] || { echo "Timed out waiting for Tor egress"; exit 1; }
          for i in {1..60}; do
            ok=true
            for m in makerd1 makerd2; do
              setup=$(docker logs "coinswap-$m" 2>&1 | grep -c "Server setup complete" || true)
              announced=$(docker logs "coinswap-$m" 2>&1 | grep -c "Nostr relay accepted" || true)
              if [ "$setup" -ge 1 ] && [ "$announced" -ge 1 ]; then
                echo "  $m ready (setup=$setup announced=$announced)"
              else
                echo "  $m not ready (setup=$setup announced=$announced)"; ok=false
              fi
            done
            $ok && { echo "both makers announced (attempt $i)"; break; }
            echo "waiting for makers ($i/60)..."; sleep 10
          done

      - name: Test
        working-directory: coinswap-csharp
        run: dotnet test Coinswap.Tests/Coinswap.Tests.csproj -c Release

      - name: Cleanup Docker environment
        if: always()
        working-directory: ./ffi-commons
        run: ./ffi-docker-setup stop || true

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-test-logs
          path: |
            ~/.coinswap/taker/debug.log
            ffi-commons/.coinswap-docker-stack/logs/
          retention-days: 7
