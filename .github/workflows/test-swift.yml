name: Test Swift

# Tests the Swift bindings for cs-ffi on macOS.
# Triggered by changes to cs-ffi or coinswap-swift directories.

on:
  push:
    branches:
      - main
    paths:
      - "ffi-commons/**"
      - "coinswap-swift/**"
  pull_request:
    branches:
      - main
    paths:
      - "ffi-commons/**"
      - "coinswap-swift/**"

permissions: {}

jobs:
  test:
    name: "Test Swift library"
    runs-on: macos-15-intel 
    defaults:
      run:
        working-directory: ./coinswap-swift

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi-commons/target/
          key: ${{ runner.os }}-cargo-swift-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm/
            coinswap-swift/.build/
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('coinswap-swift/Package.swift', 'coinswap-swift/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Setup Docker on macOS
        uses: douglascamata/setup-docker-macos-action@v1.1.0
        with:
          colima-network-address: false

      - name: Check Docker
        run: |
          docker version
          docker info

      - name: Setup Docker environment
        working-directory: ./ffi-commons
        run: |
          chmod +x ffi-docker-setup
          if docker pull coinswap/bitcoin-mutinynet:latest && docker pull coinswap/coinswap:electrum-sync; then
            echo "Using prebuilt Docker images"
          else
            echo "Prebuilt image pull failed; falling back to local image build"
            ./ffi-docker-setup setup
          fi
          # Fixed topology: bitcoind + electrs + tor + 2 RPC makers + 2 Electrum makers.
          ./ffi-docker-setup start

      - name: Check Docker containers status
        run: |
          echo "=== Docker Containers ==="
          docker ps -a

          echo -e "\n=== Bitcoin Core Logs ==="
          docker logs coinswap-bitcoind --tail 50 || true

          echo -e "\n=== Tor Logs ==="
          docker logs coinswap-tor --tail 30 || true

          echo -e "\n=== electrs ==="
          docker logs coinswap-electrs --tail 30 || true

          echo -e "\n=== Maker1 Logs ==="
          docker logs coinswap-makerd1 --tail 30 || true

          echo -e "\n=== Electrum Maker2 Logs ==="
          docker logs coinswap-makerd2 --tail 30 || true

          echo -e "\n=== Host Port Connectivity ==="
          for i in {1..20}; do
            all_ok=true
            for port in 18442 28332 9051 50001; do
              nc -z 127.0.0.1 "$port" 2>/dev/null && echo "port $port ok" || { echo "port $port not reachable"; all_ok=false; }
            done
            if $all_ok; then
              echo "All ports forwarded to host!"; break
            fi
            echo "Retry $i/20..."
            sleep 2
          done
          if ! $all_ok; then
            echo "Port forwarding failed. Colima status:"
            colima status || true
            colima list || true
            exit 1
          fi

      - name: "Build Swift package"
        run: bash ./build-xcframework-ci.sh

      - name: Wait for Tor egress then makers
        run: |
          # An open control port doesn't mean Tor can build circuits; probe real egress to a public relay, then poll both makers until each has set up and announced (empty offerbook otherwise => NotEnoughMakersInOfferBook).
          for i in {1..60}; do
            for relay in nos.lol relay.damus.io; do
              curl -s --max-time 20 --socks5-hostname 127.0.0.1:9050 "https://$relay" -o /dev/null && { echo "Tor egress OK via $relay (attempt $i)"; tor_ok=1; break; }
            done
            [ -n "$tor_ok" ] && break
            echo "waiting for Tor egress ($i/60)..."; sleep 5
          done
          [ -n "$tor_ok" ] || { echo "Timed out waiting for Tor egress"; exit 1; }
          for i in {1..60}; do
            ok=true
            for m in makerd1 makerd2; do
              setup=$(docker logs "coinswap-$m" 2>&1 | grep -c "Server setup complete" || true)
              announced=$(docker logs "coinswap-$m" 2>&1 | grep -c "Nostr relay accepted" || true)
              if [ "$setup" -ge 1 ] && [ "$announced" -ge 1 ]; then
                echo "  $m ready (setup=$setup announced=$announced)"
              else
                echo "  $m not ready (setup=$setup announced=$announced)"; ok=false
              fi
            done
            $ok && { echo "both makers announced (attempt $i)"; break; }
            echo "waiting for makers ($i/60)..."; sleep 10
          done

      - name: "Run Swift live swap tests (backend x protocol matrix)"
        run: sudo -E swift test --filter LiveSwapTests

      - name: Cleanup Docker environment
        if: always()
        working-directory: ./ffi-commons
        run: |
          ./ffi-docker-setup stop || true
          colima stop || true
