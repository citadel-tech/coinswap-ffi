name: Android Tests

on:
  push:
    branches:
      - main
    paths:
      - 'coinswap-kotlin/**'
      - 'ffi-commons/**'
      - '.github/workflows/test-kotlin.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'coinswap-kotlin/**'
      - 'ffi-commons/**'
      - '.github/workflows/test-kotlin.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-kotlin:
    name: Test Kotlin Bindings
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi-commons/target/
          key: ${{ runner.os }}-cargo-kotlin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            coinswap-kotlin/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin FFI build artifacts
        id: cache-kotlin-ffi-build
        uses: actions/cache@v4
        with:
          path: |
            coinswap-kotlin/lib/src/main/jniLibs/x86_64/
            coinswap-kotlin/lib/src/main/kotlin/
          key: ${{ runner.os }}-kotlin-ffi-build-${{ hashFiles('ffi-commons/Cargo.lock', 'ffi-commons/Cargo.toml', 'ffi-commons/src/**', 'ffi-commons/uniffi.toml', 'coinswap-kotlin/build-scripts/development/build-dev-linux-jvm.sh', 'coinswap-kotlin/lib/build.gradle.kts') }}

      - name: "Build Android library"
        if: steps.cache-kotlin-ffi-build.outputs.cache-hit != 'true'
        working-directory: ./coinswap-kotlin
        run: |
          chmod +x build-scripts/development/build-dev-linux-jvm.sh
          bash ./build-scripts/development/build-dev-linux-jvm.sh

      - name: "Enable KVM"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Docker environment
        working-directory: ./ffi-commons
        run: |
          chmod +x ffi-docker-setup
          if docker pull coinswap/bitcoin-mutinynet:latest && docker pull coinswap/coinswap:electrum-sync; then
            echo "Using prebuilt Docker images"
          else
            echo "Prebuilt image pull failed; falling back to local image build"
            ./ffi-docker-setup setup
          fi
          # Fixed topology: bitcoind + electrs + tor + 2 RPC makers + 2 Electrum makers.
          ./ffi-docker-setup start

      - name: Check stack readiness
        run: |
          docker ps --format 'table {{.Names}}\t{{.Status}}'
          for i in {1..20}; do
            ok=true
            for port in 18442 28332 9051 50001; do
              nc -z 127.0.0.1 "$port" 2>/dev/null || ok=false
            done
            $ok && { echo "all ports reachable"; break; }
            echo "waiting for ports ($i/20)..."; sleep 2
          done

      - name: Wait for Tor egress then makers
        run: |
          # An open control port doesn't mean Tor can build circuits; probe real egress to a public relay, then poll both makers until each has set up and announced (empty offerbook otherwise => NotEnoughMakersInOfferBook).
          for i in {1..60}; do
            for relay in nos.lol relay.damus.io; do
              curl -s --max-time 20 --socks5-hostname 127.0.0.1:9050 "https://$relay" -o /dev/null && { echo "Tor egress OK via $relay (attempt $i)"; tor_ok=1; break; }
            done
            [ -n "$tor_ok" ] && break
            echo "waiting for Tor egress ($i/60)..."; sleep 5
          done
          [ -n "$tor_ok" ] || { echo "Timed out waiting for Tor egress"; exit 1; }
          for i in {1..60}; do
            ok=true
            for m in makerd1 makerd2; do
              setup=$(docker logs "coinswap-$m" 2>&1 | grep -c "Server setup complete" || true)
              announced=$(docker logs "coinswap-$m" 2>&1 | grep -c "Nostr relay accepted" || true)
              if [ "$setup" -ge 1 ] && [ "$announced" -ge 1 ]; then
                echo "  $m ready (setup=$setup announced=$announced)"
              else
                echo "  $m not ready (setup=$setup announced=$announced)"; ok=false
              fi
            done
            $ok && { echo "both makers announced (attempt $i)"; break; }
            echo "waiting for makers ($i/60)..."; sleep 10
          done

      - name: Run Kotlin swap test (legacy/taproot x rpc/electrum, 2 makers)
        working-directory: ./coinswap-kotlin
        run: |
          chmod +x gradlew
          ./gradlew :lib:testDebugUnitTest --tests "org.coinswap.SwapTest" --no-daemon --stacktrace

      - name: Cleanup Docker
        if: always()
        working-directory: ./ffi-commons
        run: |
          ./ffi-docker-setup stop || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-results
          path: |
            coinswap-kotlin/build/reports/tests/
            coinswap-kotlin/build/test-results/
          retention-days: 7
