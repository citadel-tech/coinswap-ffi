name: Python Tests

on:
  push:
    branches:
      - main
    paths:
      - 'coinswap-python/**'
      - 'ffi-commons/**'
      - '.github/workflows/test-python.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'coinswap-python/**'
      - 'ffi-commons/**'
      - '.github/workflows/test-python.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-python:
    name: Test Python Bindings
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi-commons/target/
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'coinswap-python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Python FFI build artifacts
        id: cache-python-ffi-build
        uses: actions/cache@v4
        with:
          path: |
            coinswap-python/src/coinswap/native/linux-x86_64/
            coinswap-python/src/coinswap/coinswap.py
          key: ${{ runner.os }}-python-ffi-build-${{ hashFiles('ffi-commons/Cargo.lock', 'ffi-commons/Cargo.toml', 'ffi-commons/src/**', 'ffi-commons/uniffi.toml', 'coinswap-python/build-scripts/development/build-dev-linux-x86_64.sh') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            pkg-config

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Setup Docker environment
        working-directory: ./ffi-commons
        run: |
          chmod +x ffi-docker-setup
          if docker pull coinswap/bitcoin-mutinynet:latest && docker pull coinswap/coinswap:electrum-sync; then
            echo "Using prebuilt Docker images"
          else
            echo "Prebuilt image pull failed; falling back to local image build"
            ./ffi-docker-setup setup
          fi
          # Fixed topology: bitcoind + electrs + tor + 2 RPC makers + 2 Electrum makers.
          ./ffi-docker-setup start

      - name: Check Docker containers status
        run: |
          echo "=== Docker Containers ==="
          docker ps -a
          
          echo -e "\n=== Bitcoin Core Logs ==="
          docker logs coinswap-bitcoind --tail 50 || true
          
          echo -e "\n=== Tor Logs ==="
          docker logs coinswap-tor --tail 30 || true
          
          echo -e "\n=== electrs ==="
          docker logs coinswap-electrs --tail 30 || true

          echo -e "\n=== Maker1 Logs ==="
          docker logs coinswap-makerd1 --tail 30 || true
          
          echo -e "\n=== Electrum Maker2 Logs ==="
          docker logs coinswap-makerd2 --tail 30 || true

          echo -e "\n=== Host Port Connectivity ==="
          for i in {1..20}; do
            all_ok=true
            for port in 18442 28332 9051 50001; do
              nc -z 127.0.0.1 "$port" 2>/dev/null && echo "port $port ok" || { echo "port $port not reachable"; all_ok=false; }
            done
            if $all_ok; then
              echo "All ports forwarded to host!"; break
            fi
            echo "Retry $i/20..."
            sleep 2
          done

      - name: Wait for Tor egress then makers
        run: |
          # An open control port doesn't mean Tor can build circuits; probe real egress to a public relay, then poll both makers until each has set up and announced (empty offerbook otherwise => NotEnoughMakersInOfferBook).
          for i in {1..60}; do
            for relay in nos.lol relay.damus.io; do
              curl -s --max-time 20 --socks5-hostname 127.0.0.1:9050 "https://$relay" -o /dev/null && { echo "Tor egress OK via $relay (attempt $i)"; tor_ok=1; break; }
            done
            [ -n "$tor_ok" ] && break
            echo "waiting for Tor egress ($i/60)..."; sleep 5
          done
          [ -n "$tor_ok" ] || { echo "Timed out waiting for Tor egress"; exit 1; }
          for i in {1..60}; do
            ok=true
            for m in makerd1 makerd2; do
              setup=$(docker logs "coinswap-$m" 2>&1 | grep -c "Server setup complete" || true)
              announced=$(docker logs "coinswap-$m" 2>&1 | grep -c "Nostr relay accepted" || true)
              if [ "$setup" -ge 1 ] && [ "$announced" -ge 1 ]; then
                echo "  $m ready (setup=$setup announced=$announced)"
              else
                echo "  $m not ready (setup=$setup announced=$announced)"; ok=false
              fi
            done
            $ok && { echo "both makers announced (attempt $i)"; break; }
            echo "waiting for makers ($i/60)..."; sleep 10
          done

      - name: Build FFI bindings
        if: steps.cache-python-ffi-build.outputs.cache-hit != 'true'
        working-directory: ./coinswap-python
        run: |
          bash ./build-scripts/development/build-dev-linux-x86_64.sh

      - name: Run Python test (swap_test.py)
        working-directory: ./coinswap-python
        run: |
          echo "Running Python swap test (4 takers × 2 makers)..."
          python3 test/swap_test.py
        continue-on-error: false

      - name: Cleanup Docker environment
        if: always()
        working-directory: ./ffi-commons
        run: |
          ./ffi-docker-setup stop || true

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-logs
          path: |
            ~/.coinswap/taker/debug.log
            ffi-commons/.coinswap-docker-stack/logs/
          retention-days: 7
