name: Coinswap Rust Bindings Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '**/*.gitignore'
      - '.editorconfig'
      - 'docs/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-taker:
    name: Test RPC + Electrum Taker Methods
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ffi-commons/target/
          key: ${{ runner.os }}-cargo-taker-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            pkg-config

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Setup Docker environment
        working-directory: ./ffi-commons
        run: |
          chmod +x ffi-docker-setup
          if docker pull coinswap/bitcoin-mutinynet:latest && docker pull coinswap/coinswap:electrum-sync; then
            echo "Using prebuilt Docker images"
          else
            echo "Prebuilt image pull failed; falling back to local image build"
            ./ffi-docker-setup setup
          fi
          # Fixed topology: bitcoind + electrs + tor + 1 RPC maker + 1 Electrum maker.
          ./ffi-docker-setup start

      - name: Check stack readiness
        run: |
          # Wait for host ports, then real Tor egress (an open control port doesn't mean circuits work), then poll both makers until each has set up and announced (empty offerbook otherwise => NotEnoughMakersInOfferBook).
          docker ps --format 'table {{.Names}}\t{{.Status}}'
          for i in {1..20}; do
            ok=true
            for port in 18442 28332 9051 50001; do
              nc -z 127.0.0.1 "$port" 2>/dev/null || ok=false
            done
            $ok && { echo "all ports reachable"; break; }
            echo "waiting for ports ($i/20)..."; sleep 2
          done
          for i in {1..60}; do
            for relay in nos.lol relay.damus.io; do
              curl -s --max-time 20 --socks5-hostname 127.0.0.1:9050 "https://$relay" -o /dev/null && { echo "Tor egress OK via $relay (attempt $i)"; tor_ok=1; break; }
            done
            [ -n "$tor_ok" ] && break
            echo "waiting for Tor egress ($i/60)..."; sleep 5
          done
          [ -n "$tor_ok" ] || { echo "Timed out waiting for Tor egress"; exit 1; }
          for i in {1..60}; do
            ok=true
            for m in makerd1 makerd2; do
              setup=$(docker logs "coinswap-$m" 2>&1 | grep -c "Server setup complete" || true)
              announced=$(docker logs "coinswap-$m" 2>&1 | grep -c "Nostr relay accepted" || true)
              if [ "$setup" -ge 1 ] && [ "$announced" -ge 1 ]; then
                echo "  $m ready (setup=$setup announced=$announced)"
              else
                echo "  $m not ready (setup=$setup announced=$announced)"; ok=false
              fi
            done
            $ok && { echo "both makers announced (attempt $i)"; break; }
            echo "waiting for makers ($i/60)..."; sleep 10
          done

      - name: Run taker swap test (legacy/taproot x rpc/electrum, 2 makers)
        working-directory: ./ffi-commons
        run: cargo test tests::swap_test::main -- --nocapture --exact

      - name: Cleanup Docker environment
        if: always()
        working-directory: ./ffi-commons
        run: |
          ./ffi-docker-setup stop || true

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taker-test-logs
          path: |
            ~/.coinswap/taker/debug.log
            ffi-commons/.coinswap-docker-stack/logs/
          retention-days: 7
